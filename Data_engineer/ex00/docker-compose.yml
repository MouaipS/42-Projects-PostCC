#=========SERVICES=========#
services:
 postgres:
  container_name:	postgres
  image: postgres:16
  ports:
   - "5432:5432"
  environment:
   POSTGRES_USER: adrouin
   POSTGRES_PASSWORD: mysecretpassword
   POSTGRES_DB: piscineds
  restart: always
  volumes:
   - pg-data:/var/lib/postgresql/data
   
#=========VOLUMES=========#
volumes:
  postgres_data: