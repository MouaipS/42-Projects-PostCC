#=========SERVICES=========#
services:
 postgres:
  container_name:	postgres
  image: postgres:16
  ports:
   - "5432:5432"
  environment:
   POSTGRES_USER: adrouin
   POSTGRES_PASSWORD: mysecretpassword
   POSTGRES_DB: piscineds
  restart: always
  volumes:
   - pg-data:/var/lib/postgresql/data
   
 pgadmin:
  container_name: pgadmin
  image: dpage/pgadmin4
  restart: always
  ports:
   - "8888:80"
  environment:
   PGADMIN_DEFAULT_EMAIL: adrouin@42.com
   PGADMIN_DEFAULT_PASSWORD: password123

  volumes:
   - pgadmin-data:/var/lib/pgadmin
#=========VOLUMES=========#
volumes:
  pg-data:
  pgadmin-data: